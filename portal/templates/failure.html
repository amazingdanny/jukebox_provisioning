<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Couldn't connect</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>&#9888; Couldn't connect</h1>
    <p class="sub">{{ reason }}</p>
    <p class="sub">
      The <strong>{{ ap_ssid }}</strong> setup hotspot is back up — reconnect
      to it if your phone switched away, then try again.
    </p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
