# Installed by install.sh to /etc/NetworkManager/dnsmasq-shared.d/
#
# NetworkManager spins up its own internal dnsmasq for any connection
# using ipv4.method=shared (our "Hotspot" AP profile) and reads extra
# config from this directory. This one line makes that dnsmasq answer
# EVERY DNS query from AP clients with the Pi's own address, instead of
# NXDOMAIN/real answers there's no real upstream to resolve anyway.
#
# This is what makes iOS/Android/Windows captive-portal probe hostnames
# (captive.apple.com, connectivitycheck.gstatic.com,
# www.msftconnecttest.com, ...) land on the Pi's portal instead of
# timing out — which is what triggers the OS's automatic sign-in popup.
#
# Only takes effect while the Hotspot connection is actually up (i.e.
# only while NetworkManager's shared dnsmasq for it is running) — has no
# effect on your home Wi-Fi connection, DNS resolution there is entirely
# separate.
#
# AP_GATEWAY_PLACEHOLDER is substituted by install.sh with the AP_GATEWAY
# value from config.env (default 10.42.0.1, NetworkManager's standard
# address for ipv4.method=shared).
address=/#/AP_GATEWAY_PLACEHOLDER
